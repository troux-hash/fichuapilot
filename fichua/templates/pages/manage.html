{% extends "base.html" %}
{% block title %}Manage booking · {{ app_name }}{% endblock %}
{% block content %}
<div class="container narrow" style="padding:var(--space-8) var(--space-4)">
  <h1 class="page-title">Manage your booking</h1>
  <p class="muted">Enter your booking reference and the email you booked with.</p>
  <form class="card card-pad stack" method="post" action="/manage" style="margin-top:var(--space-5)">
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    <div class="field"><label for="reference">Booking reference</label>
      <input id="reference" name="reference" placeholder="FCH-XXXXXX" value="{{ form.get('reference', '') }}" autocapitalize="characters" required></div>
    <div class="field"><label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" value="{{ form.get('email', '') }}" required></div>
    <button class="btn btn-primary btn-block" type="submit">Find my booking</button>
  </form>
</div>
{% endblock %}
