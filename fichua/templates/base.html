<!doctype html>
<html lang="en"{% if request.query_params.get('theme') %} data-theme="{{ request.query_params.get('theme') }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ app_name }} — find your stay in seconds{% endblock %}</title>
  <meta name="description" content="Search and book hotels in seconds. Total prices up front, free cancellation on most rooms, pay at the hotel.">
  <meta name="theme-color" content="#0E1B33">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ asset('/static/css/tokens.css') }}">
  <link rel="stylesheet" href="{{ asset('/static/css/base.css') }}">
  <link rel="stylesheet" href="{{ asset('/static/css/components.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="sr-only" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/" aria-label="{{ app_name }} home"><span class="logo-mark" aria-hidden="true">F</span>{{ app_name }}</a>
      <nav class="nav">{% block nav %}<a href="/manage">Manage booking</a>{% endblock %}</nav>
    </div>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container row-between">
      <span>© {{ app_name }} · Prices shown are the total for your stay.</span>
      <span><a href="/manage">Manage a booking</a></span>
    </div>
  </footer>
  <script src="{{ asset('/static/js/app.js') }}" defer></script>
</body>
</html>
